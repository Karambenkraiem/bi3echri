services:
  postgres:
    image: postgres:16-alpine
    container_name: bi3echri-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bi3echri}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-bi3echri}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bi3echri}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Pas de port publié : uniquement accessible depuis le réseau interne Compose.
    # Décommenter si un accès direct depuis l'hôte est nécessaire (ex: migration manuelle) :
    # ports:
    #   - "5432:5432"

  backend:
    build:
      context: ./backend
      target: production
    image: bi3echri-backend:prod
    container_name: bi3echri-backend-prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bi3echri}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bi3echri}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      STOREFRONT_URL: ${STOREFRONT_URL:?STOREFRONT_URL is required}
      PORT: 3001
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uploads_data_prod:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
        NEXT_PUBLIC_STOREFRONT_URL: ${NEXT_PUBLIC_STOREFRONT_URL:?NEXT_PUBLIC_STOREFRONT_URL is required}
    image: bi3echri-frontend:prod
    container_name: bi3echri-frontend-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  storefront:
    build:
      context: ./storefront
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
        NEXT_PUBLIC_BACKOFFICE_URL: ${NEXT_PUBLIC_BACKOFFICE_URL:?NEXT_PUBLIC_BACKOFFICE_URL is required}
    image: bi3echri-storefront:prod
    container_name: bi3echri-storefront-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data_prod:
  uploads_data_prod:
